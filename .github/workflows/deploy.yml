name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_API_BASE: https://devops-portfolio-microservice.vercel.app

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html is missing"; find dist -name 'index.html'; exit 1; }
          test -f dist/dashboard/index.html || { echo "the dashboard page did not build"; exit 1; }
          test -f dist/404.html || { echo "404.html is missing"; exit 1; }
          grep -q "daisyui" dist/_astro/*.css || { echo "daisyUI never made it into the CSS bundle"; exit 1; }
          test -f dist/favicon.svg && test -f dist/robots.txt
          echo "build output verified"
          du -sh dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
